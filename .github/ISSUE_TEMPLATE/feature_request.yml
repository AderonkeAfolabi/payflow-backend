name: Feature or improvement
description: Propose a change to payflow-backend.
labels: ["enhancement", "backend"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. Mention any contract, API or UI change it needs.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How a reviewer can tell it is done.
      placeholder: |
        - [ ] ...
        - [ ] Tests cover ...

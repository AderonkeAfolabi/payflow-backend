# Render blueprint for the Payflow backend.
#
# The indexer and keeper run inside the same process as the API (see
# src/index.ts), so a single web service is enough at this scale. Split the
# keeper into its own worker before running more than a few hundred mandates.
services:
  - type: web
    name: payflow-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: STELLAR_NETWORK
        value: testnet
      - key: SOROBAN_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: NETWORK_PASSPHRASE
        value: Test SDF Network ; September 2015
      - key: PLAN_REGISTRY_ID
        value: CDLGJKHOZ4UY4HJXFND7VPEGAFJOBQB7E2W7IGO3JIJLZ6WIX2NCIQ3V
      - key: VAULT_ID
        value: CABD66DE3FEREIHPS77XUFRTA5EBSE3RZLCRPE3MOYHO42AH7NEAERL5
      - key: SUBSCRIPTION_ID
        value: CAM2ISZPOZXMYUIC7WPAXKTU6I4QY4HGWLGATK65EWOPRMTHKAWBMMKR
      - key: DATABASE_PATH
        value: /var/data/payflow.db
      - key: KEEPER_ENABLED
        value: "false"
      - key: KEEPER_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
    disk:
      name: payflow-data
      mountPath: /var/data
      sizeGB: 1
